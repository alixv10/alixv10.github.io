<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create a Python Variable</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
}

/* Draggable items */
#items {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 15px;
}

.draggable {
    display: inline-block;
    width: 80px;
    padding: 15px;
    background-color: #4CAF50;
    color: white;
    border-radius: 5px;
    cursor: grab;
    font-size: 20px;
}

/* Drop zones */
.container {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 40px;
}

.dropzone {
    width: 80px;
    height: 80px;
    border: 2px dashed #999;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Button styling */
button {
    margin-top: 30px;
    padding: 10px;
    width: 180px;
    background-color: white;
    color: #4CAF50;
    border: 2px solid #4CAF50;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background-color: #4CAF50;
    color: white;
}
</style>
</head>

<body>

<h2>Build a Python Variable</h2>
<p>Drag the pieces into the correct order</p>

<!-- Draggable pieces -->
<div id="items">
    <div class="draggable" draggable="true" data-value="=">=</div>
    <div class="draggable" draggable="true" data-value="5">5</div>
    <div class="draggable" draggable="true" data-value="x">x</div>
</div>

<!-- Drop zones -->
<div class="container">
    <div class="dropzone" data-position="0"></div>
    <div class="dropzone" data-position="1"></div>
    <div class="dropzone" data-position="2"></div>
</div>

<!-- Button -->
<button onclick="checkAnswer()">Check Answer</button>

<button onclick="resetActivity()">Try again</button>

<script>
const draggables = document.querySelectorAll('.draggable');
const dropzones = document.querySelectorAll('.dropzone');

draggables.forEach(item => {
    item.addEventListener('dragstart', () => {
        item.classList.add('dragging');
    });

    item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
    });
});

dropzones.forEach(zone => {
    zone.addEventListener('dragover', e => {
        e.preventDefault();
        const dragging = document.querySelector('.dragging');
        if (zone.children.length === 0) { // only allow one item
            zone.appendChild(dragging);
        }
    });
});

/* Correct order */
const correctOrder = ["x", "=", "5"];

function checkAnswer() {
    dropzones.forEach(zone => {
        const item = zone.children[0];

        if (!item) return;

        const value = item.dataset.value;
        const position = parseInt(zone.dataset.position);

        if (value === correctOrder[position]) {
            item.style.backgroundColor = "#4CAF50"; // correct
        } else {
            item.style.backgroundColor = "#FFD54F"; // incorrect
        }
    });
}

function resetActivity() {
    const itemsContainer = document.getElementById("items");
    const items = document.querySelectorAll('.draggable');

    items.forEach(item => {
        // Move back to top container
        itemsContainer.appendChild(item);

        // Reset color
        item.style.backgroundColor = "#4CAF50";
    });
}
</script>

</body>
</html>
